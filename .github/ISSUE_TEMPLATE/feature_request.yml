name: "功能建议 / Feature request"
description: "说明要解决的问题和场景 / Explain the problem and use case"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "问题与场景 / Problem and use case"
      description: "你现在遇到什么不便？What is difficult today?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 / Proposed solution"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 / Alternatives considered"
